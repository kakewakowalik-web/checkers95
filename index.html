<script id="logic">
/* ===== Game logic: pure, DOM-free. Twists are toggled via state.opts =====
   opts: {bsod, bin, ads, mines, cutpaste}
   Move shapes: {from,to,cap}            normal step / jump
                {type:'restore',to}       Recycle Bin restore
                {type:'closead'}          close pop-up ad (uses turn)
                {type:'teleport',from,to} king Cut & Paste
*/
var Checkers=(function(){
  var RED='r',BLACK='b',TWISTS=['bsod','bin','ads','mines','cutpaste','powers'],POWERS=['shield','bomb','speed','ghost','freeze'];
  function opp(c){return c===RED?BLACK:RED;}
  function create(opts,seed){
    var b=[];for(var r=0;r<8;r++){b.push([]);for(var c=0;c<8;c++){
      var p=null;if((r+c)%2===1){if(r<3)p={c:BLACK,k:false};else if(r>4)p={c:RED,k:false};}b[r].push(p);}}
    opts=opts||{};var o={};TWISTS.forEach(function(k){o[k]=!!opts[k];});
    var s={board:b,turn:BLACK,chain:null,winner:null,opts:o,turnNo:0,holes:[],bins:{r:0,b:0},restoreUsed:{r:false,b:false},
      ad:null,mines:[],seed:(seed==null?(Date.now()%2147483647):seed)|0||1,phase:o.mines?'setup':'play',events:[],
      frozen:[],chainJumped:[],caps:{r:0,b:0}};
    if(o.powers){ // fairness: both sides get the SAME two distinct powers, on random men
      var pool=POWERS.slice(),pick=[];for(var i=0;i<2;i++)pick.push(pool.splice(Math.floor(rng(s)*pool.length),1)[0]);
      [RED,BLACK].forEach(function(col){var men=[];for(var r=0;r<8;r++)for(var c=0;c<8;c++)if(b[r][c]&&b[r][c].c===col)men.push(b[r][c]);
        pick.forEach(function(pw){b.length;men.splice(Math.floor(rng(s)*men.length),1)[0].pw=pw;});});}
    return s;
  }
  function clone(s){return {board:s.board.map(function(row){return row.map(function(p){return p?{c:p.c,k:p.k,cut:p.cut,pw:p.pw,gu:p.gu}:null;});}),
    turn:s.turn,chain:s.chain?s.chain.slice():null,winner:s.winner,opts:s.opts,turnNo:s.turnNo,
    holes:s.holes.map(function(h){return {r:h.r,c:h.c,left:h.left};}),bins:{r:s.bins.r,b:s.bins.b},restoreUsed:{r:s.restoreUsed.r,b:s.restoreUsed.b},
    ad:s.ad?{r:s.ad.r,c:s.ad.c,w:s.ad.w,h:s.ad.h,text:s.ad.text}:null,mines:s.mines.map(function(m){return {r:m.r,c:m.c,owner:m.owner};}),
    seed:s.seed,phase:s.phase,events:[],frozen:(s.frozen||[]).map(function(q){return q.slice();}),chainJumped:(s.chainJumped||[]).map(function(q){return q.slice();}),caps:s.caps?{r:s.caps.r,b:s.caps.b}:{r:0,b:0}};}
  function rng(s){s.seed=(s.seed*48271)%2147483647;return s.seed/2147483647;}
  function inB(r,c){return r>=0&&r<8&&c>=0&&c<8;}
  function isHole(s,r,c){return s.holes.some(function(h){return h.r===r&&h.c===c;});}
  function underAd(s,r,c){var a=s.ad;return !!a&&r>=a.r&&r<a.r+a.h&&c>=a.c&&c<a.c+a.w;}
  function blocked(s,r,c){return isHole(s,r,c)||underAd(s,r,c);}
  function has(list,r,c){return !!list&&list.some(function(q){return q[0]===r&&q[1]===c;});}
  function isFrozen(s,r,c){return has(s.frozen,r,c);}
  function dirs(p){var f=p.c===RED?-1:1;return p.k?[[1,1],[1,-1],[-1,1],[-1,-1]]:[[f,1],[f,-1]];}
  function pieceMoves(s,r,c){
    var p=s.board[r][c],steps=[],jumps=[];if(!p||blocked(s,r,c)||isFrozen(s,r,c))return {steps:steps,jumps:jumps};
    dirs(p).forEach(function(d){
      var r1=r+d[0],c1=c+d[1];if(!inB(r1,c1))return;

/* ===== AI: Easy = random, Normal/Hard = alpha-beta minimax. Twist-aware (special moves searched, hidden enemy mines not seen). ===== */
var AI=(function(){

  var celeb=null;
